<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - LawyerNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- Reset & Base Styles --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Noto Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #f4f4f4;
        color: #1d1c1d;
        -webkit-font-smoothing: antialiased;
      }

      /* --- Hero Banner (Slack Purple Purple) --- */
      .hero-banner {
        background-color: #1a2053; /* Exact Slack Purple */
        color: #ffffff;
        text-align: center;
        padding: 64px 24px 180px 24px; /* Deep bottom padding to accommodate overlapping card */
        position: relative;
      }

      .hero-banner h1 {
        font-size: 44px;
        font-weight: 800;
        margin-bottom: 20px;
        letter-spacing: -1px;
      }

      .hero-banner p {
        font-size: 16px;
        line-height: 1.5;
        max-width: 600px;
        margin: 0 auto 12px auto;
        color: rgba(255, 255, 255, 0.9);
      }

      .hero-banner p strong {
        color: #ffffff;
      }

      /* --- Centered Form Card --- */
      .container {
        max-width: 640px;
        margin: -120px auto 60px auto; /* Pulls the card up into the purple header */
        position: relative;
        padding: 0 20px;
      }

      .contact-card {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
      }

      /* --- Form Element Framework --- */
      .form-group {
        margin-bottom: 24px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #1d1c1d;
      }

      .form-group input[type="email"],
      .form-group input[type="text"],
      .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 1px solid #868686;
        border-radius: 4px;
        color: #1d1c1d;
        transition: border-color 0.15s ease-in-out;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #1264a3; /* Slack blue focus outline */
        box-shadow: 0 0 0 3px rgba(18, 100, 163, 0.15);
      }

      /* Native Placeholder style matching screenshot */
      ::placeholder {
        color: #b0b0b0;
        opacity: 1;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 120px;
      }

      /* --- CTA Button & Links --- */
      .btn-submit {
        background-color: #611f69; /* Slightly brighter button purple */
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn-submit:hover {
        background-color: #4a154b;
      }

      .privacy-link {
        display: inline-block;
        margin-top: 24px;
        font-size: 14px;
        color: #1264a3;
        text-decoration: none;
      }

      .privacy-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="hero-banner">
      <h1>Contact Us</h1>
      <p>
        At LawyerNest, we are dedicated to providing a seamless online
        experience. If you encounter any technical issues with our website or
        need assistance, please reach out.
      </p>
      <p>
        <strong>📧 Email:</strong> Lawyersnest@gmail.com &nbsp;|&nbsp;
        <strong>📞 Phone:</strong> 8779642973, 9372294445
      </p>
    </div>

    <div class="container">
      <div class="contact-card">
        <form action="#" method="POST">
          <div class="form-group">
            <label for="email">Your Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />
          </div>

          <div class="form-group">
            <label for="message">How can we help?</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button type="submit" class="btn-submit">Send</button>

          <br />

          <a href="#" class="privacy-link">Privacy Policy</a>
        </form>
      </div>
    </div>
  </body>
</html>
