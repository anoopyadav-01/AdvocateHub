<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="auth.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="img-container">
        <h1>Welcome To AdvocateHub</h1>
        <img src="./All_logos/650426b0e40b8a3630fc10b8_img (3).webp" alt="" />
      </div>
      <div class="signup-container">
        <h1>Login</h1>
        <div class="toggle-buttons">
          <button id="loginBtn" class="active">Login</button>
          <button id="signupBtn">SignUp</button>
        </div>
        <div class="user-type" id="userTypeButtons">
          <button id="clientBtn" class="active">Client</button>
          <button id="lawyerBtn">Lawyer</button>
        </div>

        <form id="clientForm" class="active">
          <input type="text" name="name" placeholder="Name" required />
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <input type="tel" name="phone" placeholder="Phone Number" required />
          <input type="file" name="photo" accept="image/*" required />
          <button type="submit">Submit</button>
        </form>

        <!-- Lawyer Signup Form -->
        <form id="lawyerForm" class="scrollable" enctype="multipart/form-data">
          <input type="text" name="name" placeholder="Name" required />
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <input
            type="tel"
            name="phone"
            placeholder="Contact Number"
            required
          />
          <input
            type="text"
            name="languages"
            placeholder="Languages Known"
            required
          />
          <input type="text" name="city" placeholder="City" required />
          <input
            type="text"
            name="experience"
            placeholder="Experience (Years)"
            required
          />
          <input
            type="text"
            name="practiceArea"
            placeholder="Area of Practice"
            required
          />
          <input
            type="text"
            name="enrollmentId"
            placeholder="Enrollment ID"
            required
          />
          <input type="text" name="court" placeholder="court" required />
          <input type="text" name="state" placeholder="state" required />
          <input type="file" name="photo" accept="image/*" required />
          <textarea name="bio" placeholder="Bio" rows="4" required></textarea>
          <button type="submit">Submit</button>
        </form>

        <!--login from-->
        <form id="loginForm">
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <div class="pass-link">
            <a href="#" id="forgotPasswordLink">Forgot Password?</a>
          </div>
          <button type="submit">Login</button>
        </form>

        <div id="userRoleInfo" class="hidden"></div>

        <div class="forget-password-for hidden" id="forgotPasswordContainer">
          <button type="button" id="backToLogin">← Back To Login</button>

          <form id="forgotPasswordForm">
            <label for="email">Email:</label>
            <input type="email" id="email" required />
            <button type="submit">Send OTP</button>
            <p id="message"></p>
          </form>

          <form id="verifyOtpForm" style="display: none">
            <label for="otp">Enter OTP:</label>
            <input type="text" id="otp" required />

            <label for="newPassword">New Password:</label>
            <input type="password" id="newPassword" required />

            <button type="submit">Reset Password</button>
            <p id="otpMessage"></p>
          </form>
        </div>
      </div>
    </div>
  </body>
  <script src="./auth.js"></script>
</html>
