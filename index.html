<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forget Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      form {
        background: rgba(30, 30, 30, 0.9);
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        width: 270px;
        margin: 0 auto;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: white;
      }
      input[type="email"],
      input[type="text"],
      input[type="password"] {
        width: 80%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        width: 89%;
        padding: 10px;
        background-color: orangered;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #4cae4c;
      }
      p {
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <form id="forgotPasswordForm">
      <label for="email">Email:</label>
      <input type="email" id="email" required />
      <button type="submit">Send OTP</button>
      <p id="message"></p>
    </form>

    <!-- OTP Verification Form -->
    <form id="verifyOtpForm" style="display: none">
      <label for="otp">Enter OTP:</label>
      <input type="text" id="otp" required />
      <label for="newPassword">New Password:</label>
      <input type="password" id="newPassword" required />
      <button type="submit">Reset Password</button>
      <p id="otpMessage"></p>
    </form>

    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const message = document.getElementById("message");

          fetch("/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          })
            .then((response) => response.json())
            .then((data) => {
              message.textContent = data.message;
              document.getElementById("verifyOtpForm").style.display = "block"; // Show OTP form
            })
            .catch((error) => {
              message.textContent = "Error: " + error.message;
            });
        });

      document
        .getElementById("verifyOtpForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const otp = document.getElementById("otp").value;
          const newPassword = document.getElementById("newPassword").value;
          const otpMessage = document.getElementById("otpMessage");

          fetch("/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp, newPassword }),
          })
            .then((response) => response.json())
            .then((data) => {
              otpMessage.textContent = data.message;

              console.log("Response Data:", data);
              if (data.success) {
                console.log("Redirecting to auth.html");
                setTimeout(() => {
                  window.location.href = "auth.html";
                }, 1500);
              }
            })
            .catch((error) => {
              otpMessage.textContent = "Error: " + error.message;
              console.error("Error:", error);
            });
        });
    </script>
  </body>
</html>
